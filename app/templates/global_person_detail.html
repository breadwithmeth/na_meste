<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global — PALEVO</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="dot"></span> PALEVO</a>
    <nav class="nav">
      <a href="/" class="nav-link">Камеры</a>
      <a href="/employees" class="nav-link">Сотрудники</a>
      <a href="/presence" class="nav-link">Присутствие</a>
      <a href="/unknown" class="nav-link">Посторонние</a>
      <a href="/global" class="nav-link active">Люди</a>
      <a href="/spatial-model" class="nav-link">Пространство</a>
    </nav>
    <span id="gp-title" class="muted">Global</span>
  </header>

  <main class="container wide">
    <!-- Шапка личности -->
    <section class="panel">
      <div class="gp-head">
        <img id="gp-avatar" class="gp-avatar-lg" alt="" hidden>
        <div class="gp-head-info">
          <h2 id="gp-name" style="margin:0 0 6px">G#…</h2>
          <div id="gp-meta" class="muted small"></div>
        </div>
      </div>
    </section>

    <!-- Траектория -->
    <section class="panel" style="margin-top:16px">
      <div class="panel-head"><h2>Траектория</h2></div>
      <div id="trajectory" class="trajectory"></div>
    </section>

    <!-- Объединение личностей -->
    <section class="panel" style="margin-top:16px">
      <div class="panel-head">
        <h2>Объединение</h2>
        <span class="muted small">Если один и тот же человек получил два global_id — влейте лишний сюда</span>
      </div>
      <form id="merge-form" class="merge-form">
        <input type="number" id="merge-source" min="1" placeholder="G#id лишней личности" required>
        <button type="submit" class="btn">Влить в эту личность</button>
        <span id="merge-status" class="muted small"></span>
      </form>
    </section>

    <!-- Таймлайн -->
    <section class="panel" style="margin-top:16px">
      <div class="panel-head">
        <h2>Таймлайн</h2>
        <span class="muted small">Наблюдения (со снимками) и события — переходы между камерами</span>
      </div>
      <div class="table-wrap">
        <table class="table" id="timeline-table">
          <thead>
            <tr><th>Время</th><th>Тип</th><th>Камера</th><th>Track</th><th>Детали</th><th>Снимок</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="timeline-empty" class="empty">Наблюдений пока нет.</div>
    </section>
  </main>

  <script>window.GLOBAL_ID = {{ global_id }};</script>
  <script src="/static/js/global_person_detail.js"></script>
</body>
</html>
