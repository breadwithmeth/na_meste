<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PALEVO — Мониторинг</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="dot"></span> PALEVO</a>
    <nav class="nav">
      <a href="/" class="nav-link active">Камеры</a>
      <a href="/employees" class="nav-link">Сотрудники</a>
      <a href="/presence" class="nav-link">Присутствие</a>
      <a href="/unknown" class="nav-link">Посторонние</a>
    </nav>
    <div class="topbar-right">
      <button id="btn-add" class="btn primary">+ Добавить камеру</button>
    </div>
  </header>

  <main class="container wide">
    <section class="panel">
      <div class="panel-head">
        <h2>Камеры</h2>
        <span id="summary" class="muted"></span>
      </div>
      <div id="camera-grid" class="camera-grid"></div>
      <div id="empty" class="empty" hidden>
        Камер пока нет. Нажмите «Добавить камеру», чтобы создать первую.
      </div>
    </section>
  </main>

  <!-- Модальное окно добавления / редактирования камеры -->
  <div id="modal" class="modal-backdrop" hidden>
    <div class="modal">
      <h2 id="modal-title">Добавить камеру</h2>
      <form id="camera-form" autocomplete="off">
        <label class="field">Название
          <input name="name" required maxlength="100" placeholder="Касса 1">
        </label>
        <div class="row">
          <label class="field grow">NVR IP
            <input name="nvr_host" required placeholder="192.168.1.100">
          </label>
          <label class="field port">RTSP порт
            <input name="rtsp_port" type="number" value="554" min="1" max="65535" required>
          </label>
        </div>
        <div class="row">
          <label class="field grow">Логин
            <input name="username" required placeholder="admin">
          </label>
          <label class="field grow">Пароль
            <input name="password" type="password" placeholder="пароль NVR">
          </label>
        </div>
        <div class="row">
          <label class="field">Канал
            <input name="channel" type="number" value="1" min="1" max="64" required>
          </label>
          <label class="field">Поток
            <select name="stream_type">
              <option value="main">main — основной</option>
              <option value="sub">sub — дополнительный</option>
            </select>
          </label>
          <label class="field checkbox-field">
            <input type="checkbox" name="enabled" checked> Включена
          </label>
        </div>

        <div id="test-result" class="test-result" hidden></div>

        <div class="modal-actions">
          <button type="button" id="btn-test" class="btn">Проверить подключение</button>
          <span class="spacer"></span>
          <button type="button" id="btn-cancel" class="btn">Отмена</button>
          <button type="submit" class="btn primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
