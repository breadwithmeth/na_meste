<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Мониторинг{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="topbar">
    <nav class="nav">
      <a href="/" class="nav-link {{ 'active' if active_page == 'cameras' else '' }}">Камеры</a>
      <a href="/employees" class="nav-link {{ 'active' if active_page == 'employees' else '' }}">Сотрудники</a>
      <a href="/presence" class="nav-link {{ 'active' if active_page == 'presence' else '' }}">Присутствие</a>
      <a href="/unknown" class="nav-link {{ 'active' if active_page == 'unknown' else '' }}">Посторонние</a>
      <a href="/global" class="nav-link {{ 'active' if active_page == 'global' else '' }}">Люди</a>
      <a href="/spatial-model" class="nav-link {{ 'active' if active_page == 'spatial' else '' }}">Пространство</a>
    </nav>
    <div class="topbar-right">
      {% block topbar_right %}{% endblock %}
    </div>
  </header>

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
